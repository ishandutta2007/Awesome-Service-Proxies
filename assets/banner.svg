<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e17"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b12"/></linearGradient><radialGradient id="proxyGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="60%" stop-color="#6366f1" stop-opacity=".1"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="lineGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".2"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".3"/></linearGradient><linearGradient id="lineGrad2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#818cf8" stop-opacity=".3"/><stop offset="50%" stop-color="#c084fc" stop-opacity=".8"/><stop offset="100%" stop-color="#38bdf8" stop-opacity=".2"/></linearGradient><filter id="neonGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="heavyGlow" width="180%" height="180%" x="-40%" y="-40%"><feGaussianBlur result="blur2" stdDeviation="8"/><feMerge><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes pulseNode{0%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1;filter:drop-shadow(0 0 12px #38bdf8)}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes particleFly1{0%{transform:translate(140px,90px);opacity:0}20%,80%{opacity:1}}@keyframes particleFly2{